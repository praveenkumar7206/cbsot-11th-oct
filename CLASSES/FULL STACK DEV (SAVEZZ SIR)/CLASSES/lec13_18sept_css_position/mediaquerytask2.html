<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            background: yellow;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1rem;
            padding: .5rem;
            /* text-align: center; */
            grid-template-areas: 
            "box-1 box-1 box-2 box-3"
            "box-1 box-1 box-2 box-4";
        }
        section div{
            border: 1px solid;
            display:  flex;
            justify-content: center;
            align-items: center;
        }
        #one{
            display: flex;
            align-self: self-start;
            /* height: 2rem; */
        }
        @media screen and (max-width:768px) {
            section {
                  grid-template-columns: 1fr 1fr  1fr;
            grid-template-rows: 1fr 1fr 1fr ;
            grid-template-areas: 
            "box-1  box-1 box-1"
            "box-2 box-2 box-3"
            "box-2  box-2 box-4";
        }
            
        }
        @media screen and (max-width:323px) {
            section{
            grid-template-columns: 1fr;
            grid-template-rows: 1fr ;
            grid-template-areas: 
            "box-1"
            "box-2"
            "box-3"
            "box-4"
        }
    }
    </style>
    <!-- display none use by taregtting div , to hide any things we we switch to mobile abd all  -->

</head>

<body>
    <h2>CSS GRID Layout</h2>

    <section>
        <div style="grid-area: box-1;">1</div>
        <div style="grid-area: box-2;">2</div>
        <div style="grid-area: box-3;">3</div>
        <div style="grid-area: box-4;">4</div>
    </section>
</body>

</html>
