<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .container .row .div {
        margin: 2rem;
        border: black 2px;
      }
    </style>
  </head>
  <body>
    <h1>grid system , columns</h1>
    <h1>Hello, world!</h1>
    <h2>task 1</h2>
    <div class="container bg-info">
      <div class="row">
        <div class="col border border-black text-center">col</div>
        <div class="col border border-black text-center">col</div>
        <div class="col border border-black text-center">col</div>
        <div class="col border border-black text-center">col</div>
      </div>
      <div class="row">
        <div class="col-8 border border-black text-center">col</div>
        <div class="col-4 border border-black text-center">col</div>
      </div>
    </div>

    <h3>responsive version</h3>
    <div class="container bg-danger">
      <div class="row">
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 border border-black text-center"
        >
          col
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 border border-black text-center"
        >
          col
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 border border-black text-center"
        >
          col
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 border border-black text-center"
        >
          col
        </div>
      </div>
      <div class="row">
        <div class="col-8 border border-black text-center">col</div>
        <div class="col-4 border border-black text-center">col</div>
      </div>
    </div>
    <br />
    <h5> all cols customize in row directly</h5>
    <div class="container bg-danger">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 border border-black text-center">
        <div class="col order-4">1</div>
        <div class="col">2</div>
        <div class="col">3</div>
        <div class="col">4</div>
      </div>
      <div class="row">
        <div class="col-8 border border-black text-center">col</div>
        <div class="col-4 border border-black text-center">col</div>
      </div>
    </div>
    <br>
    <h2>task 2</h2>
    <div class="container bg-info">
      <div class="row">
        <div class="col-sm-8 border border-black text-center">col-sm-8</div>
        <div class="col-sm-4 border border-black text-center">col-sm-4</div>
      </div>
      <div class="row">
        <div class="col-sm border border-black text-center">col</div>
        <div class="col-sm border border-black text-center">col</div>
        <div class="col-sm border border-black text-center">col</div>
      </div>
    </div>
    <br />
    <h2>task 3</h2>
    <div class="container bg-info">
      <div class="row">
        <div class="col-md-8 border border-black text-center">col-md-8</div>
        <div class="col-6 col-md-4 border border-black text-center">
          col-6 col-md-4
        </div>
      </div>
      <div class="row">
        <div class=".col-4 border border-black text-center">
          .col-6 .col-md-4
        </div>
        <div class=".col-4 border border-black text-center">
          .col-6 .col-md-4
        </div>
        <div class=".col-4 border border-black text-center">
          .col-6 .col-md-4
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
