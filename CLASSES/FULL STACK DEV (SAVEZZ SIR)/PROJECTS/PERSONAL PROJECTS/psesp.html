    const playSound = (type = 'click') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'glitch') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {
        // Audio context muted or restricted by browser
      }
    };

                            <option value="CS2">Counter-Strike 2</option>
                            <option value="LoL">League of Legends</option>
                            <option value="Apex">Apex Legends</option>
                          </select>
                        </div>
                        <div className="col-12 col-md-6">
                          <label className="form-label text-muted fs-7">CURRENT RANK / PEAK RATING</label>
                          <input 
                            type="text" 
                            className="form-control cyber-input" 
                            placeholder="e.g. Radiant Top 100 / Global Elite"
                            value={tryoutForm.rank}
                            onChange={(e) => setTryoutForm({...tryoutForm, rank: e.target.value})}
                          />
                        </div>
                        <div className="col-12 col-md-6">
                          <label className="form-label text-muted fs-7">EMAIL ADDRESS</label>
                          <input 
                            type="email" 
                            className="form-control cyber-input" 
                            placeholder="your.email@domain.com" 
                            required
                            value={tryoutForm.email}
                            onChange={(e) => setTryoutForm({...tryoutForm, email: e.target.value})}
                          />
                        </div>
                        <div className="col-12 col-md-6">
                          <label className="form-label text-muted fs-7">DISCORD ID / HANDLE</label>
                          <input 
                            type="text" 
                            className="form-control cyber-input" 
                            placeholder="username#0000" 
                            required
                            value={tryoutForm.discord}
                            onChange={(e) => setTryoutForm({...tryoutForm, discord: e.target.value})}
                          />
                        </div>
                        <div className="col-12">
                          <label className="form-label text-muted fs-7">HIGHLIGHT REEL / VOD LINK / PORTFOLIO</label>
                          <input 
                            type="url" 
                            className="form-control cyber-input" 
                            placeholder="https://youtube.com/watch?v=..." 
                            value={tryoutForm.portfolio}
                            onChange={(e) => setTryoutForm({...tryoutForm, portfolio: e.target.value})}
                          />
                        </div>
                        <div className="col-12">
                          <button type="submit" className="cyber-btn w-100 justify-content-center fs-6 mt-3">
                            <i className="fa-solid fa-paper-plane"></i> SUBMIT APPLICATION
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <footer className="py-5 bg-black border-top border-cyan text-muted">
            <div className="container">
              <div className="row g-4 mb-4">
                <div className="col-12 col-lg-4">
                  <div className="d-flex align-items-center gap-2 mb-3">
                    <span className="cyber-font fw-black text-glow-cyan fs-3">PS</span>
                    <span className="nav-logo-text">PS ESPORTS</span>
                  </div>
                  <p className="fs-7 text-muted">
                    Premier global gaming and competitive esports organization. Built on competitive integrity, innovation, and championship culture.
                  </p>
                  <div className="d-flex gap-3 fs-4 mt-3">
                    <a href="#" className="text-muted text-glow-cyan"><i className="fa-brands fa-twitch"></i></a>
                    <a href="#" className="text-muted text-glow-pink"><i className="fa-brands fa-youtube"></i></a>
                    <a href="#" className="text-muted text-glow-cyan"><i className="fa-brands fa-x-twitter"></i></a>
                    <a href="#" className="text-muted text-glow-pink"><i className="fa-brands fa-instagram"></i></a>
                    <a href="#" className="text-muted text-glow-cyan"><i className="fa-brands fa-discord"></i></a>
                  </div>
                </div>

                <div className="col-6 col-lg-2">
                  <h5 className="sub-heading text-white fs-6 mb-3">NAVIGATION</h5>
                  <ul className="list-unstyled fs-7 space-y-2">
                    <li><a href="#hero" className="text-muted text-decoration-none hover-glow">Home</a></li>
                    <li><a href="#rosters" className="text-muted text-decoration-none hover-glow">Teams & Rosters</a></li>
                    <li><a href="#matches" className="text-muted text-decoration-none hover-glow">Match Schedule</a></li>
                    <li><a href="#trophies" className="text-muted text-decoration-none hover-glow">Hall of Fame</a></li>
                  </ul>
                </div>

                <div className="col-6 col-lg-2">
                  <h5 className="sub-heading text-white fs-6 mb-3">ORGANIZATION</h5>
                  <ul className="list-unstyled fs-7 space-y-2">
                    <li><a href="#tryouts" className="text-muted text-decoration-none hover-glow">Careers & Tryouts</a></li>
                    <li><a href="#merch" className="text-muted text-decoration-none hover-glow">Apparel Store</a></li>
                    <li><a href="#" className="text-muted text-decoration-none hover-glow">Press Kit</a></li>
                    <li><a href="#" className="text-muted text-decoration-none hover-glow">Privacy Policy</a></li>
                  </ul>
                </div>

                <div className="col-12 col-lg-4">
                  <h5 className="sub-heading text-white fs-6 mb-3">HQ NEWSLETTER</h5>
                  <p className="fs-7">Get exclusive match breakdown alerts, roster updates, and apparel drop codes.</p>
                  <div className="input-group">
                    <input type="email" className="form-control cyber-input" placeholder="Enter your email" />
                    <button className="cyber-btn btn-sm" onClick={() => playSound('success')}>SUBSCRIBE</button>
                  </div>
                </div>
              </div>

              <div className="pt-4 border-top border-secondary border-opacity-25 d-flex flex-wrap justify-content-between align-items-center fs-8">
                <div>&copy; 2026 PS ESPORTS ORGANIZATION. ALL RIGHTS RESERVED.</div>
                <div className="text-glow-cyan">DESIGNED FOR CHAMPIONS</div>
              </div>
            </div>
          </footer>

          {selectedPlayer && (
            <div className="modal show d-block cyber-modal" style={{background: 'rgba(0,0,0,0.85)'}} tabIndex="-1">
              <div className="modal-dialog modal-dialog-centered modal-lg">
                <div className="modal-content">
                  <div className="modal-header border-bottom border-cyan">
                    <h5 className="modal-title cyber-font text-glow-cyan">{selectedPlayer.ign} - PLAYER DOSSIER</h5>
                    <button type="button" className="btn-close btn-close-white" onClick={() => setSelectedPlayer(null)}></button>
                  </div>
                  <div className="modal-body p-4">
                    <div className="row g-4 align-items-center">
                      <div className="col-12 col-md-5">
                        <img src={selectedPlayer.avatar} alt={selectedPlayer.ign} className="img-fluid rounded border border-cyan" />
                      </div>
                      <div className="col-12 col-md-7">
                        <span className="badge bg-cyan text-dark fw-bold mb-2">{selectedPlayer.game}</span>
                        <h3 className="cyber-font fs-2 text-white mb-1">{selectedPlayer.ign}</h3>
                        <div className="text-muted mb-3">{selectedPlayer.realName} • <strong className="text-glow-pink">{selectedPlayer.role}</strong></div>
                        <p className="fs-7 text-light mb-3">{selectedPlayer.bio}</p>

                        <div className="row text-center g-2 mb-3">
                          <div className="col-4 p-2 bg-dark rounded border border-secondary border-opacity-25">
                            <div className="fs-8 text-muted">K/D RATIO</div>
                            <div className="fw-bold fs-5 text-glow-cyan">{selectedPlayer.kd}</div>
                          </div>
                          <div className="col-4 p-2 bg-dark rounded border border-secondary border-opacity-25">
                            <div className="fs-8 text-muted">WIN RATE</div>
                            <div className="fw-bold fs-5 text-glow-pink">{selectedPlayer.winRate}</div>
                          </div>
                          <div className="col-4 p-2 bg-dark rounded border border-secondary border-opacity-25">
                            <div className="fs-8 text-muted">SIGNATURE</div>
                            <div className="fw-bold fs-7 text-white truncate">{selectedPlayer.signature}</div>
                          </div>
                        </div>

                        {selectedPlayer.gear && (
                          <div className="p-3 rounded bg-dark border border-cyan border-opacity-25 fs-8">
                            <div className="text-glow-cyan fw-bold mb-1"><i className="fa-solid fa-microchip me-1"></i> HARDWARE SETUP</div>
                            <div>Mouse: {selectedPlayer.gear.mouse || selectedPlayer.gear.device}</div>
                            {selectedPlayer.gear.keyboard && <div>Keyboard: {selectedPlayer.gear.keyboard}</div>}
                            {selectedPlayer.gear.headset && <div>Headset: {selectedPlayer.gear.headset}</div>}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedStream && (
            <div className="modal show d-block cyber-modal" style={{background: 'rgba(0,0,0,0.9)'}} tabIndex="-1">
              <div className="modal-dialog modal-dialog-centered modal-xl">
                <div className="modal-content">
                  <div className="modal-header border-bottom border-pink">
                    <h5 className="modal-title cyber-font text-glow-pink">🔴 LIVE BROADCAST - {selectedStream.tournament}</h5>
                    <button type="button" className="btn-close btn-close-white" onClick={() => setSelectedStream(null)}></button>
                  </div>
                  <div className="modal-body p-0">
                    <div className="row g-0">
                      <div className="col-12 col-lg-8 bg-black">
                        <div className="ratio ratio-16x9">
                          <iframe 
                            src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" 
                            title="Esports Stream" 
                            allowFullScreen
                          ></iframe>
                        </div>
                      </div>
                      <div className="col-12 col-lg-4 bg-dark p-3 d-flex flex-column" style={{height: '420px'}}>
                        <div className="fw-bold text-glow-cyan mb-2 border-bottom border-secondary border-opacity-25 pb-2">
                          <i className="fa-solid fa-comments me-1"></i> LIVE MATCH CHAT
                        </div>
                        <div className="flex-grow-1 overflow-auto fs-8 space-y-2 mb-3">
                          <div><strong className="text-cyan">CyberFan99:</strong> PS ESPORTS IS UNSTOPPABLE TODAY!</div>
                          <div><strong className="text-pink">ValorantGod:</strong> VIPER 1v3 CLUTCH WAS INSANE 🔥</div>
                          <div><strong className="text-warning">NeonNinja:</strong> SEN needs a timeout asap</div>
                          <div><strong className="text-cyan">AcesHigh:</strong> GG map 3 for PS!</div>
                          <div><strong className="text-light">ProAnalyst:</strong> Clean site executes on Haven.</div>
                        </div>
                        <div className="input-group">
                          <input type="text" className="form-control cyber-input fs-8" placeholder="Send chat message..." />
                          <button className="cyber-btn cyber-btn-pink btn-sm">SEND</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className={`cart-backdrop ${isCartOpen ? 'open' : ''}`} onClick={() => setIsCartOpen(false)}></div>
          <div className={`cart-drawer ${isCartOpen ? 'open' : ''}`}>
            <div className="p-4 border-bottom border-cyan d-flex justify-content-between align-items-center">
              <h4 className="cyber-font text-glow-cyan m-0"><i className="fa-solid fa-bag-shopping me-2"></i> YOUR CART</h4>
              <button className="btn-close btn-close-white" onClick={() => setIsCartOpen(false)}></button>
            </div>

            <div className="p-4 flex-grow-1 overflow-auto">
              {cart.length === 0 ? (
                <div className="text-center text-muted my-5">
                  <i className="fa-solid fa-cart-flatbed fs-1 mb-3 text-glow-cyan"></i>
                  <p>Your gear bag is empty.</p>
                </div>
              ) : (
                cart.map((item, idx) => (
                  <div key={`${item.id}-${item.size}`} className="d-flex align-items-center gap-3 mb-3 p-2 rounded bg-dark border border-secondary border-opacity-25">
                    <img src={item.img} alt={item.name} style={{width: '60px', height: '60px', objectFit: 'contain'}} />
                    <div className="flex-grow-1">
                      <div className="fw-bold fs-7 text-white">{item.name}</div>
                      <div className="text-muted fs-8">Size: {item.size} • ${item.price}</div>
                      <div className="d-flex align-items-center gap-2 mt-1">
                        <button className="btn btn-sm btn-outline-secondary py-0 px-2 text-white" onClick={() => updateCartQty(item.id, item.size, -1)}>-</button>
                        <span className="fs-7 fw-bold">{item.qty}</span>
                        <button className="btn btn-sm btn-outline-secondary py-0 px-2 text-white" onClick={() => updateCartQty(item.id, item.size, 1)}>+</button>
                      </div>
                    </div>
                    <div className="cyber-font text-glow-pink fw-bold">${(item.price * item.qty).toFixed(2)}</div>
                  </div>
                ))
              )}
            </div>

            <div className="p-4 border-top border-cyan bg-black">
              <div className="d-flex justify-content-between fs-5 fw-bold mb-3">
                <span>SUBTOTAL:</span>
                <span className="cyber-font text-glow-cyan">${cartTotal.toFixed(2)}</span>
              </div>
              <button 
                className="cyber-btn cyber-btn-pink w-100 justify-content-center"
                disabled={cart.length === 0}
                onClick={() => { playSound('success'); setIsCartOpen(false); setIsCheckoutOpen(true); }}
              >
                PROCEED TO CHECKOUT
              </button>
            </div>
          </div>

          {isCheckoutOpen && (
            <div className="modal show d-block cyber-modal" style={{background: 'rgba(0,0,0,0.85)'}} tabIndex="-1">
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content text-center p-4">
                  <div className="display-1 text-glow-cyan mb-3"><i className="fa-solid fa-circle-check"></i></div>
                  <h3 className="cyber-font text-white mb-2">ORDER CONFIRMED!</h3>
                  <p className="text-muted fs-7 mb-4">Thank you for supporting PS ESPORTS. Your championship gear is being prepared for dispatch.</p>
                  <button className="cyber-btn mx-auto" onClick={() => { setCart([]); setIsCheckoutOpen(false); }}>
                    RETURN TO HEADQUARTERS
                  </button>
                </div>
              </div>
            </div>
          )}

          {tryoutSuccessToast && (
            <div className="position-fixed bottom-0 end-0 p-3" style={{zIndex: 3000}}>
              <div className="toast show bg-dark text-white border border-cyan shadow-lg">
                <div className="toast-header bg-black text-glow-cyan border-bottom border-cyan">
                  <i className="fa-solid fa-crosshair me-2"></i>
                  <strong className="me-auto cyber-font">APPLICATION RECEIVED</strong>
                  <button type="button" className="btn-close btn-close-white" onClick={() => setTryoutSuccessToast(false)}></button>
                </div>
                <div className="toast-body fs-7">
                  Your profile has been logged in the PS Esports recruitment mainframe. Scout managers will reach out on Discord/Email!
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
